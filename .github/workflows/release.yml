name: Prepare SDK artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: humchat-node-alpha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/release/release-*/*.tgz
            target/release/release-*/SHA256SUMS
            target/release/release-*/release-manifest.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      # This creates an Actions artifact only. npm publication remains disabled.
